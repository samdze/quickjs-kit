name: Release Readiness

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  core:
    uses: ./.github/workflows/ci.yml

  platforms:
    uses: ./.github/workflows/platforms.yml

  deep-quality:
    uses: ./.github/workflows/quality.yml

  artifacts:
    name: Reproducible readiness artifacts
    needs: [core, platforms, deep-quality]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a
        with:
          swift-version: "6.3.3"
      - name: Verify locked and vendored inputs
        run: |
          test -f Package.resolved
          test -f Tests/TypeScriptIntegration/package-lock.json
          Scripts/verify-vendored-quickjs.sh
          git diff --exit-code
      - name: Build clean source archive
        run: |
          mkdir -p .build/readiness
          git archive --format=tar.gz --prefix=quickjs-kit/ HEAD > .build/readiness/quickjs-kit-source.tar.gz
      - name: Generate public symbol graphs
        run: Scripts/check-symbol-graphs.sh .build/readiness/symbol-graphs
      - name: Generate DocC archive
        run: >-
          xcodebuild docbuild
          -scheme QuickJSKit
          -destination 'platform=macOS'
          -derivedDataPath .build/readiness/docc
          -skipMacroValidation
          OTHER_DOCC_FLAGS='--warnings-as-errors'
      - name: Generate benchmark report
        run: |
          swift build --package-path IntegrationTests/PlatformSmoke -c release
          consumer_directory=$(swift build --package-path IntegrationTests/PlatformSmoke -c release --show-bin-path)
          for run in 1 2 3 4 5; do
            swift run -c release QuickJSKitBenchmarks \
              --iterations 100 \
              --json-output ".build/readiness/benchmarks-$run.json" \
              --consumer-executable "$consumer_directory/QuickJSKitPlatformSmoke"
          done
          swift run -c release QuickJSKitBenchmarks summarize \
            --label "QuickJSKit release candidate" \
            --json-output .build/readiness/benchmarks-summary.json \
            --markdown-output .build/readiness/benchmarks-summary.md \
            .build/readiness/benchmarks-1.json \
            .build/readiness/benchmarks-2.json \
            .build/readiness/benchmarks-3.json \
            .build/readiness/benchmarks-4.json \
            .build/readiness/benchmarks-5.json
      - name: Collect license and vendored-source records
        run: |
          mkdir -p .build/readiness/licenses
          cp LICENSE .build/readiness/licenses/QuickJSKit-LICENSE
          cp Sources/CQuickJS/LICENSE .build/readiness/licenses/QuickJS-LICENSE
          cp Sources/CQuickJS/UPSTREAM.json .build/readiness/
          cp Sources/CQuickJS/CHECKSUMS.sha256 .build/readiness/
      - name: Generate artifact checksums
        working-directory: .build/readiness
        run: |
          find . -type f ! -name checksums.sha256 -print |
            LC_ALL=C sort |
            while IFS= read -r file; do
              shasum -a 256 "$file"
            done > checksums.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quickjskit-readiness-${{ github.sha }}
          path: .build/readiness
          if-no-files-found: error
          retention-days: 30
