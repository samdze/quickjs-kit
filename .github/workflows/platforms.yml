name: Platform Qualification

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  apple-devices:
    name: ${{ matrix.platform }}
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            destination: generic/platform=iOS
          - platform: tvOS
            destination: generic/platform=tvOS
          - platform: watchOS
            destination: generic/platform=watchOS
          - platform: visionOS
            destination: generic/platform=visionOS
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Select and verify the Swift 6.3 Xcode toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          xcrun swift --version
          xcrun swift --version | grep -Eq 'Swift version 6\.3|Apple Swift version 6\.3'
          xcrun swift package dump-package >/dev/null
      - name: Build library product
        run: >-
          xcodebuild build
          -scheme QuickJSKit
          -destination '${{ matrix.destination }}'
          -skipMacroValidation
          CODE_SIGNING_ALLOWED=NO
      - name: Build macro declarations product
        run: >-
          xcodebuild build
          -scheme QuickJSKitMacros
          -destination '${{ matrix.destination }}'
          -skipMacroValidation
          CODE_SIGNING_ALLOWED=NO
      - name: Build portable consumer
        working-directory: IntegrationTests/PlatformSmoke
        run: >-
          xcodebuild build
          -scheme QuickJSKitPlatformSmoke
          -destination '${{ matrix.destination }}'
          -skipMacroValidation
          CODE_SIGNING_ALLOWED=NO

  android:
    name: Android AArch64 and x86-64 emulator
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9
        with:
          swift-version: "6.3.3"
      - name: Select the Swift SDK directory
        shell: bash
        run: printf 'SWIFT_SDKS_PATH=%s\n' "$RUNNER_TEMP/swift-sdks" >> "$GITHUB_ENV"
      - name: Install verified Swift Android SDK
        run: >-
          swift sdk install
          --swift-sdks-path "$SWIFT_SDKS_PATH"
          https://download.swift.org/swift-6.3.3-release/android-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_android.artifactbundle.tar.gz
          --checksum d160cc3206dd1886dae3fef2337af5e25ec034692cd0ec225721c56cc69da7f5
      - name: Install and configure Android NDK r27d
        shell: bash
        run: |
          set -euo pipefail
          sdk_list="$(swift sdk list --swift-sdks-path "$SWIFT_SDKS_PATH")"
          printf '%s\n' "$sdk_list"
          grep -Fq "swift-6.3.3-RELEASE_android" <<<"$sdk_list"

          android_sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$android_sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$android_sdkmanager" \
            "ndk;27.3.13750724" \
            "platform-tools" \
            "emulator" \
            "system-images;android-35;default;x86_64"
          ndk_home="$ANDROID_HOME/ndk/27.3.13750724"
          printf 'ANDROID_NDK_HOME=%s\n' "$ndk_home" >> "$GITHUB_ENV"

          if [[ ! -d "$SWIFT_SDKS_PATH" ]]; then
            echo "Swift SDK directory was not created: $SWIFT_SDKS_PATH" >&2
            exit 1
          fi
          mapfile -t setup_scripts < <(
            find "$SWIFT_SDKS_PATH" \
              -type f \
              -path "*/swift-android/scripts/setup-android-sdk.sh" \
              -print
          )
          if [[ "${#setup_scripts[@]}" -ne 1 ]]; then
            echo "Expected exactly one Android SDK setup script, found ${#setup_scripts[@]}." >&2
            find "$SWIFT_SDKS_PATH" -maxdepth 4 -print >&2
            exit 1
          fi
          ANDROID_NDK_HOME="$ndk_home" "${setup_scripts[0]}"
      - name: Enable and verify KVM for the Android emulator
        shell: bash
        run: |
          set -euo pipefail

          diagnose_kvm() {
            echo "Android emulator requires a usable KVM device on this runner." >&2
            echo "Runner identity:" >&2
            id >&2 || true
            echo "KVM group:" >&2
            getent group kvm >&2 || true
            echo "KVM device:" >&2
            ls -l /dev/kvm >&2 || true
          }

          if ! echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null; then
            diagnose_kvm
            exit 1
          fi
          if ! sudo udevadm control --reload-rules; then
            diagnose_kvm
            exit 1
          fi
          if ! sudo udevadm trigger --name-match=kvm; then
            diagnose_kvm
            exit 1
          fi
          if ! sudo udevadm settle; then
            diagnose_kvm
            exit 1
          fi

          if [[ ! -e /dev/kvm || ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            diagnose_kvm
            exit 1
          fi

          emulator="$ANDROID_HOME/emulator/emulator"
          if ! accel_output="$("$emulator" -accel-check 2>&1)"; then
            printf '%s\n' "$accel_output" >&2
            diagnose_kvm
            exit 1
          fi
          printf '%s\n' "$accel_output"
      - name: Build AArch64 consumer
        run: >-
          swift build
          --package-path IntegrationTests/PlatformSmoke
          --swift-sdks-path "$SWIFT_SDKS_PATH"
          --swift-sdk aarch64-unknown-linux-android28
          --static-swift-stdlib
      - name: Build x86-64 consumer
        run: >-
          swift build
          --package-path IntegrationTests/PlatformSmoke
          --swift-sdks-path "$SWIFT_SDKS_PATH"
          --swift-sdk x86_64-unknown-linux-android28
          --static-swift-stdlib
      - name: Run x86-64 consumer in Android emulator
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_AVD_HOME="$RUNNER_TEMP/quickjskit-avd"

          emulator="$ANDROID_HOME/emulator/emulator"
          adb="$ANDROID_HOME/platform-tools/adb"
          avdmanager="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          avd_name="quickjskit-smoke"
          emulator_log="$RUNNER_TEMP/quickjskit-emulator.log"
          emulator_pid=""

          cleanup() {
            local status=$?

            if [[ -n "$emulator_pid" ]] && kill -0 "$emulator_pid" 2>/dev/null; then
              "$adb" -s emulator-5554 emu kill >/dev/null 2>&1 || true
              wait "$emulator_pid" || true
            fi

            if (( status != 0 )); then
              set +e
              echo "Android emulator diagnostics:" >&2
              "$adb" devices -l >&2
              df -h "$RUNNER_TEMP" "$ANDROID_HOME" "$ANDROID_AVD_HOME" >&2
              cat "$ANDROID_AVD_HOME/$avd_name.avd/config.ini" >&2
              cat "$emulator_log" >&2
            fi

            return "$status"
          }
          trap cleanup EXIT

          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | "$avdmanager" create avd --force \
            --name "$avd_name" \
            --package "system-images;android-35;default;x86_64"
          emulator_args=(
            -avd "$avd_name"
            -no-window
            -no-snapshot
            -noaudio
            -no-boot-anim
            -no-metrics
            -gpu swiftshader_indirect
            -accel on
          )
          printf 'Launching Android emulator (acceleration: on):'
          printf ' %q' "$emulator" "${emulator_args[@]}"
          printf '\n'
          "$emulator" "${emulator_args[@]}" >"$emulator_log" 2>&1 &
          emulator_pid=$!

          deadline=$((SECONDS + 600))
          until [[ "$("$adb" -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              echo "The Android emulator exited before completing boot." >&2
              exit 1
            fi
            if (( SECONDS >= deadline )); then
              echo "Timed out waiting for the Android emulator to boot." >&2
              exit 1
            fi
            sleep 2
          done

          echo "Android emulator output:"
          cat "$emulator_log"

          smoke_binary="IntegrationTests/PlatformSmoke/.build/x86_64-unknown-linux-android28/debug/QuickJSKitPlatformSmoke"
          shared_library="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/x86_64-linux-android/libc++_shared.so"
          "$adb" -s emulator-5554 push "$smoke_binary" /data/local/tmp/
          "$adb" -s emulator-5554 push "$shared_library" /data/local/tmp/
          "$adb" -s emulator-5554 shell \
            "cd /data/local/tmp && LD_LIBRARY_PATH=. ./QuickJSKitPlatformSmoke"
