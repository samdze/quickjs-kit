name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  swift:
    name: Swift 6.3 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9
        if: runner.os != 'Windows'
        with:
          swift-version: "6.3.3"
      - uses: compnerd/gha-setup-swift@eeda069c5bc95ac8a9ac5cea7d4f588ae5420ca5
        if: runner.os == 'Windows'
        with:
          swift-version: swift-6.3.3-release
          swift-build: 6.3.3-RELEASE
      - name: Run debug tests
        run: swift test
      - name: Run release tests with warnings as errors
        run: swift test -c release -Xswiftc -warnings-as-errors
      - name: Build standalone consumers
        run: |
          swift build --package-path Examples
          swift build --package-path Integration/PlatformSmoke

  release-quality:
    name: Release quality gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9
        with:
          swift-version: "6.3.3"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Tests/TypeScriptIntegration/package-lock.json
      - name: Verify vendored QuickJS
        run: Scripts/verify-vendored-quickjs.sh
      - name: Build CQuickJS with warnings as errors
        env:
          CFLAGS: -Werror
        run: swift build -c release --target CQuickJS
      - name: Validate TypeScript and TSDoc
        working-directory: Tests/TypeScriptIntegration
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Validate public symbol graphs
        run: Scripts/check-symbol-graphs.sh
      - name: Check API compatibility
        shell: bash
        run: |
          baseline=$(tr -d '[:space:]' < .github/api-baseline)
          test -n "$baseline"
          swift package diagnose-api-breaking-changes "$baseline"

  apple-devices:
    name: ${{ matrix.platform }}
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            destination: generic/platform=iOS
          - platform: tvOS
            destination: generic/platform=tvOS
          - platform: watchOS
            destination: generic/platform=watchOS
          - platform: visionOS
            destination: generic/platform=visionOS
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify the Swift 6.3 Xcode toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          xcrun swift --version | grep -Eq 'Swift version 6\.3|Apple Swift version 6\.3'
      - name: Build library product
        run: >-
          xcodebuild build
          -scheme QuickJSKit
          -destination '${{ matrix.destination }}'
          -skipMacroValidation
          CODE_SIGNING_ALLOWED=NO
      - name: Build macro declarations product
        run: >-
          xcodebuild build
          -scheme QuickJSKitMacros
          -destination '${{ matrix.destination }}'
          -skipMacroValidation
          CODE_SIGNING_ALLOWED=NO
      - name: Build portable consumer
        working-directory: Integration/PlatformSmoke
        run: >-
          xcodebuild build
          -scheme QuickJSKitPlatformSmoke
          -destination '${{ matrix.destination }}'
          -skipMacroValidation
          CODE_SIGNING_ALLOWED=NO

  android:
    name: Android architecture builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9
        with:
          swift-version: "6.3.3"
      - name: Select the Swift SDK directory
        shell: bash
        run: printf 'SWIFT_SDKS_PATH=%s\n' "$RUNNER_TEMP/swift-sdks" >> "$GITHUB_ENV"
      - name: Install verified Swift Android SDK
        run: >-
          swift sdk install
          --swift-sdks-path "$SWIFT_SDKS_PATH"
          https://download.swift.org/swift-6.3.3-release/android-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_android.artifactbundle.tar.gz
          --checksum d160cc3206dd1886dae3fef2337af5e25ec034692cd0ec225721c56cc69da7f5
      - name: Install and configure Android NDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_list="$(swift sdk list --swift-sdks-path "$SWIFT_SDKS_PATH")"
          printf '%s\n' "$sdk_list"
          grep -Fq "swift-6.3.3-RELEASE_android" <<<"$sdk_list"

          android_sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$android_sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$android_sdkmanager" "ndk;27.3.13750724"
          ndk_home="$ANDROID_HOME/ndk/27.3.13750724"
          printf 'ANDROID_NDK_HOME=%s\n' "$ndk_home" >> "$GITHUB_ENV"

          test -d "$SWIFT_SDKS_PATH"
          mapfile -t setup_scripts < <(
            find "$SWIFT_SDKS_PATH" \
              -type f \
              -path "*/swift-android/scripts/setup-android-sdk.sh" \
              -print
          )
          test "${#setup_scripts[@]}" -eq 1
          ANDROID_NDK_HOME="$ndk_home" "${setup_scripts[0]}"
      - name: Build AArch64 consumer
        run: >-
          swift build
          --package-path Integration/PlatformSmoke
          --swift-sdks-path "$SWIFT_SDKS_PATH"
          --swift-sdk aarch64-unknown-linux-android28
          --static-swift-stdlib
      - name: Build x86-64 consumer
        run: >-
          swift build
          --package-path Integration/PlatformSmoke
          --swift-sdks-path "$SWIFT_SDKS_PATH"
          --swift-sdk x86_64-unknown-linux-android28
          --static-swift-stdlib
