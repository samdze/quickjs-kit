name: Quality

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  documentation:
    name: DocC
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build DocC
        run: >-
          xcodebuild docbuild
          -scheme QuickJSKit
          -destination 'platform=macOS'
          -derivedDataPath .build/docc
          -skipMacroValidation
          OTHER_DOCC_FLAGS='--warnings-as-errors'

  sanitizer:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AddressSanitizer
            os: ubuntu-24.04
            arguments: --sanitize=address
          - name: ThreadSanitizer
            os: macos-15
            arguments: --sanitize=thread
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: SwiftyLab/setup-swift@38f54a76b70d989321de9dc7c840618c08cf56e9
        with:
          swift-version: "6.3.3"
          cache-snapshot: false
      - name: Run sanitizer suite
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
        run: swift test ${{ matrix.arguments }} --no-parallel

  c-undefined-behavior:
    name: UndefinedBehaviorSanitizer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: SwiftyLab/setup-swift@38f54a76b70d989321de9dc7c840618c08cf56e9
        with:
          swift-version: "6.3.3"
          cache-snapshot: false
      - name: Run C undefined-behavior checks
        run: >-
          swift test
          -Xcc -fsanitize=undefined
          -Xlinker -fsanitize=undefined

  stress:
    name: Stress
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: SwiftyLab/setup-swift@38f54a76b70d989321de9dc7c840618c08cf56e9
        with:
          swift-version: "6.3.3"
          cache-snapshot: false
      - name: Repeat sensitive suites
        run: |
          for iteration in 1 2 3 4 5; do
            swift test --filter Concurrency
            swift test --filter Promise
            swift test --filter RuntimeProvisioner
            swift test --filter RegistryLifetime
            swift test --filter MacroExpansion
          done
