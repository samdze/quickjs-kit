name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  swift:
    name: Swift 6.3 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9
        if: runner.os != 'Windows'
        with:
          swift-version: "6.3.3"
      - uses: compnerd/gha-setup-swift@eeda069c5bc95ac8a9ac5cea7d4f588ae5420ca5
        if: runner.os == 'Windows'
        with:
          swift-version: swift-6.3.3-release
          swift-build: 6.3.3-RELEASE
      - name: Verify Swift version
        run: swift --version
      - name: Run debug tests
        if: runner.os != 'Windows'
        run: swift test
      - name: Diagnose Windows debug tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnostics = Join-Path $env:RUNNER_TEMP 'quickjskit-windows-diagnostics'
          $dumpDirectory = Join-Path $diagnostics 'dumps'
          $localDumps = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps'
          $standardDumpDirectory = Join-Path $env:LOCALAPPDATA 'CrashDumps'
          $buildRoots = @(
            '.build',
            'IntegrationTests/PlatformSmoke/.build'
          )
          $applications = @(
            'QuickJSKitPackageTests.xctest',
            'QuickJSKitPlatformSmoke.exe'
          )
          $createdKeys = @()
          $exitCode = 0
          $diagnosticStart = Get-Date
          $env:QUICKJSKIT_SMOKE_DIAGNOSTICS = $diagnostics

          function Save-BinaryArtifacts {
            $binaryDirectory = Join-Path $diagnostics 'binaries'
            New-Item -ItemType Directory -Path $binaryDirectory -Force | Out-Null
            foreach ($root in $buildRoots) {
              if (-not (Test-Path $root)) {
                continue
              }
              Get-ChildItem -Path $root -Recurse -File -Include '*.exe', '*.pdb' |
                ForEach-Object {
                  Copy-Item $_.FullName -Destination $binaryDirectory -Force
                }
            }
          }

          function Save-DumpArtifacts {
            $dumpCandidates = @($dumpDirectory, $standardDumpDirectory)
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              $dumps = @(
                foreach ($candidate in $dumpCandidates) {
                  if (Test-Path $candidate) {
                    Get-ChildItem -Path $candidate -Recurse -File -Filter '*.dmp'
                  }
                }
              )
              if ($dumps.Count -gt 0) {
                break
              }
              Start-Sleep -Seconds 1
            }
            foreach ($dump in $dumps) {
              $destination = Join-Path $dumpDirectory $dump.Name
              if ([System.IO.Path]::GetFullPath($dump.FullName) -ne
                  [System.IO.Path]::GetFullPath($destination)) {
                Copy-Item $dump.FullName -Destination $dumpDirectory -Force
              }
            }
          }

          function Save-WERDiagnostics {
            $werFile = Join-Path $diagnostics 'wer.txt'
            Set-Content -Path $werFile -Value "LocalDumps root: $localDumps"
            foreach ($application in $applications) {
              $key = Join-Path $localDumps $application
              Add-Content -Path $werFile -Value "--- $key"
              if (Test-Path $key) {
                Get-ItemProperty -Path $key |
                  Out-String |
                  Add-Content -Path $werFile
              } else {
                Add-Content -Path $werFile -Value 'MISSING'
              }
            }
            try {
              Get-WinEvent -FilterHashtable @{
                LogName = 'Application'
                ProviderName = 'Windows Error Reporting'
                StartTime = $diagnosticStart
              } -ErrorAction Stop |
                Select-Object -First 20 TimeCreated, Id, LevelDisplayName, Message |
                Format-List |
                Out-String |
                Set-Content -Path (Join-Path $diagnostics 'wer-events.txt')
            } catch {
              Set-Content -Path (Join-Path $diagnostics 'wer-events.txt') -Value (
                "Unable to read Windows Error Reporting events: " + $_.Exception.Message
              )
            }
          }

          function Write-DiagnosticInventory {
            $inventory = Join-Path $diagnostics 'inventory.txt'
            Set-Content -Path $inventory -Value 'Windows diagnostic inventory'
            $revision = if (Test-Path (Join-Path $diagnostics 'revision.txt')) {
              (Get-Content (Join-Path $diagnostics 'revision.txt')) -join ' '
            } else {
              '<unknown>'
            }
            $lastStage = if (Test-Path (Join-Path $diagnostics 'stage.txt')) {
              (Get-Content (Join-Path $diagnostics 'stage.txt')) -join ' '
            } else {
              '<unknown>'
            }
            Add-Content -Path $inventory -Value "Revision: $revision"
            Add-Content -Path $inventory -Value "Last stage: $lastStage"
            Add-Content -Path $inventory -Value "Exit code: $exitCode"
            Add-Content -Path $inventory -Value 'Files:'
            $files = @(Get-ChildItem -Path $diagnostics -Recurse -File | Sort-Object FullName)
            if ($files.Count -eq 0) {
              Add-Content -Path $inventory -Value 'MISSING: diagnostic files'
            } else {
              foreach ($file in $files) {
                $relative = $file.FullName.Substring($diagnostics.Length).TrimStart('\\', '/')
                Add-Content -Path $inventory -Value "FOUND: $relative ($($file.Length) bytes)"
              }
            }
            $dumpFiles = @(
              foreach ($candidate in @($dumpDirectory, $standardDumpDirectory)) {
                if (Test-Path $candidate) {
                  Get-ChildItem -Path $candidate -Recurse -File -Filter '*.dmp'
                }
              }
            )
            if ($dumpFiles.Count -eq 0) {
              Add-Content -Path $inventory -Value 'MISSING: *.dmp (WER produced no dump)'
            } else {
              foreach ($dump in $dumpFiles) {
                Add-Content -Path $inventory -Value "DUMP: $($dump.FullName) ($($dump.Length) bytes)"
              }
            }
          }

          function Run-DiagnosticCollector([string] $name, [scriptblock] $operation) {
            try {
              & $operation
            } catch {
              Add-Content -Path (Join-Path $diagnostics 'collector-errors.txt') -Value (
                "$name failed: " + $_.Exception.Message
              )
            }
          }

          function Invoke-Stage([string] $name, [scriptblock] $operation) {
            Set-Content -Path (Join-Path $diagnostics 'stage.txt') -Value "started: $name"
            $outputPath = Join-Path $diagnostics "$name.log"
            & $operation 2>&1 | Tee-Object -FilePath $outputPath
            $stageExitCode = $LASTEXITCODE
            if ($stageExitCode -ne 0) {
              throw "The Windows diagnostic stage '$name' exited with code $stageExitCode."
            }
            Set-Content -Path (Join-Path $diagnostics 'stage.txt') -Value "completed: $name"
          }

          New-Item -ItemType Directory -Path $dumpDirectory -Force | Out-Null
          New-Item -ItemType Directory -Path $standardDumpDirectory -Force | Out-Null
          Set-Content -Path (Join-Path $diagnostics 'stage.txt') -Value 'setup'
          swift --version | Set-Content -Path (Join-Path $diagnostics 'swift-version.txt')
          git rev-parse HEAD | Set-Content -Path (Join-Path $diagnostics 'revision.txt')

          try {
            foreach ($application in $applications) {
              $key = Join-Path $localDumps $application
              if (Test-Path $key) {
                throw "The hosted runner already has Windows Error Reporting configured for '$application'."
              }
              New-Item -Path $key -Force | Out-Null
              $createdKeys += $key
              New-ItemProperty -Path $key -Name DumpFolder -PropertyType ExpandString -Value $dumpDirectory -Force | Out-Null
              New-ItemProperty -Path $key -Name DumpType -PropertyType DWord -Value 2 -Force | Out-Null
              New-ItemProperty -Path $key -Name DumpCount -PropertyType DWord -Value 3 -Force | Out-Null
              $configured = Get-ItemProperty -Path $key
              if ($configured.DumpFolder -ne $dumpDirectory -or
                  [int] $configured.DumpType -ne 2 -or
                  [int] $configured.DumpCount -ne 3) {
                throw "Windows Error Reporting configuration for '$application' was not applied."
              }
            }

            Invoke-Stage 'platform-smoke' {
              swift run --package-path IntegrationTests/PlatformSmoke -Xswiftc -g -Xlinker /DEBUG
            }
            Invoke-Stage 'single-runtime' {
              swift test -Xlinker /DEBUG --filter 'evaluate accepts an explicit result type'
            }
            Invoke-Stage 'concurrent-type-registration' {
              swift test -Xlinker /DEBUG --filter 'JavaScript-visible types initialize safely across concurrent runtimes'
            }
            Invoke-Stage 'complete-suite' {
              swift test -Xlinker /DEBUG
            }
          }
          catch {
            $_ | Out-String | Set-Content -Path (Join-Path $diagnostics 'failure.txt')
            $exitCode = 1
            Run-DiagnosticCollector 'dump collection' { Save-DumpArtifacts }
            Run-DiagnosticCollector 'binary collection' { Save-BinaryArtifacts }
            Run-DiagnosticCollector 'WER diagnostics' { Save-WERDiagnostics }
            Run-DiagnosticCollector 'inventory' { Write-DiagnosticInventory }
          }
          finally {
            foreach ($key in $createdKeys) {
              Remove-Item -Path $key -Recurse -Force -ErrorAction SilentlyContinue
            }
          }

          exit $exitCode
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure() && runner.os == 'Windows'
        with:
          name: quickjskit-windows-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/quickjskit-windows-diagnostics
          if-no-files-found: error
          retention-days: 7
      - name: Run release tests with warnings as errors
        run: swift test -c release -Xswiftc -warnings-as-errors
      - name: Build standalone consumers
        run: >-
          swift build --package-path Examples
          && swift build --package-path IntegrationTests/PlatformSmoke

  release-quality:
    name: Release quality gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9
        with:
          swift-version: "6.3.3"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Tests/TypeScriptIntegration/package-lock.json
      - name: Verify vendored QuickJS
        run: Scripts/verify-vendored-quickjs.sh
      - name: Build CQuickJS with warnings as errors
        env:
          CFLAGS: -Werror
        run: swift build -c release --target CQuickJS
      - name: Validate TypeScript and TSDoc
        working-directory: Tests/TypeScriptIntegration
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Validate public symbol graphs
        run: Scripts/check-symbol-graphs.sh
      - name: Check API compatibility
        shell: bash
        run: |
          baseline=$(tr -d '[:space:]' < .github/api-baseline)
          test -n "$baseline"
          swift package diagnose-api-breaking-changes "$baseline"
